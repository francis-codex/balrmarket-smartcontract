[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
balrmarket = "CYCLSN9sVJGKo4xy3daXvH3KFD66wPgDvAuFVRhc6RDq"

[programs.devnet]
balrmarket = "CYCLSN9sVJGKo4xy3daXvH3KFD66wPgDvAuFVRhc6RDq"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/utils/test_utils.ts tests/instructions/test_initialize_global_state.ts tests/instructions/test_create_market.ts tests/instructions/test_create_event.ts tests/instructions/test_place_order.ts tests/instructions/test_cancel_order.ts tests/instructions/test_match_orders.ts tests/instructions/test_mint_shares.ts tests/instructions/test_process_match.ts tests/state/test_account_sizes.ts"

[test]
startup_wait = 5000
shutdown_wait = 2000
timeout = 30000
